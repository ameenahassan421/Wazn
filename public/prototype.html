        border: none;
        cursor: pointer;
        padding: 0;
        background: none;
        color: inherit;

        height: 844px;

        border-radius: 44px;

        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
      }

        .stage {

          align-items: stretch;
        }

          width: 100%;
          height: 100dvh;
          border-radius: 0;
          box-shadow: none;
        }
      }

        position: fixed;
        top: 10px;
        inset-inline-end: 10px;
        display: flex;
        gap: 6px;
        z-index: 10;
      }

        font: 600 12px var(--hanken);
        color: #f7f3ec;
        background: rgba(22, 19, 14, 0.55);
        border-radius: 99px;
        padding: 8px 14px;
        min-height: 34px;
        backdrop-filter: blur(4px);

        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .screen.dark {
        background: #16130e;
        color: #f7f3ec;
      }
      .statusbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 24px 4px;
        font: 500 13px var(--mono);
        color: var(--stone-soft);
        flex-shrink: 0;
      }
      .dark .statusbar {
        color: #7a7469;
      }
      .card {
        background: var(--surface);
        border-radius: 20px;
        box-shadow:
          0 1px 2px var(--line),
          0 0 0 1px var(--line);
      }
      .panel {
        background: var(--surface);
        border-radius: 18px;
        box-shadow: 0 0 0 1px var(--line);
      }
      .scroll-col {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 22px;
        display: flex;
        flex-direction: column;
        gap: 11px;
        scrollbar-width: none;
      }
      .scroll-col::-webkit-scrollbar {
        display: none;
      }
      .cta {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        background: var(--ember);
        border-radius: 99px;
        box-shadow: 0 10px 26px rgba(232, 73, 29, 0.35);
      }
      .cta span {
        font: 700 16px var(--sora);
        color: #f7f3ec;
      }
      .step {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: var(--ground);
        display: flex;
        align-items: center;
        justify-content: center;
        font: 600 22px var(--sora);
        color: var(--text);
        flex-shrink: 0;
      }
      .step-label {
        font: 500 11px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--stone);
        margin: 0 0 5px;
      }
      .step-value {
        font: 700 29px var(--sora);
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
      }
      .step-input {
        font: 700 29px var(--sora);
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        width: 100%;
        min-height: 44px;
        border: none;
        background: var(--ground);
        border-radius: 10px;
        color: var(--text);
        text-align: center;
        outline: 2px solid var(--ember);
      }
      .pill-dark {
        font: 600 14px var(--hanken);
        color: #f7f3ec;
        background: rgba(247, 243, 236, 0.1);
        border-radius: 99px;
        padding: 13px 22px;
        min-height: 48px;
      }
      .set-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font: 500 14px var(--mono);
        color: var(--text);
        min-height: 28px;
        width: 100%;
        text-align: start;
        border-radius: 8px;
      }
      .set-row.editing {
        box-shadow: 0 0 0 2px var(--ember);
        background: var(--ember-tint);
      }
      .pr-tag {
        font: 700 10px var(--sora);
        letter-spacing: 0.08em;
        color: #f7f3ec;
        background: var(--ember);
        border-radius: 99px;
        padding: 2px 7px;
        margin-inline-start: 6px;
      }
      .queue-row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 32px;
        width: 100%;
        text-align: start;
      }
      .link-btn {
        font: 600 13px var(--hanken);
        color: var(--stone);
        min-height: 48px;
        padding: 0 14px;
      }
      .rest-chip {
        background: var(--flip-bg);
        color: var(--flip-text);
        border-radius: 16px;
        padding: 8px 8px 8px 14px;
        padding-inline-start: 14px;
        padding-inline-end: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

              '<div style="background:var(--ember-tint);border-radius:20px;padding:18px;display:flex;gap:14px;align-items:center;flex-shrink:0">' +
              '<svg width="44" height="44" viewBox="0 0 96 96" style="flex-shrink:0" aria-hidden="true"><path fill="#e8491d" fill-rule="evenodd" d="M48 4 a44 44 0 1 0 0 88 a44 44 0 1 0 0 -88 Z M48 33 a15 15 0 1 1 0 30 a15 15 0 1 1 0 -30 Z M17 43 h6 a5 5 0 0 1 5 5 a5 5 0 0 1 -5 5 h-6 a5 5 0 0 1 -5 -5 a5 5 0 0 1 5 -5 Z M73 43 h6 a5 5 0 0 1 5 5 a5 5 0 0 1 -5 5 h-6 a5 5 0 0 1 -5 -5 a5 5 0 0 1 5 -5 Z"></path></svg>' +
              '<div><p style="font:700 12px var(--sora);letter-spacing:.08em;text-transform:uppercase;color:var(--ember);margin:0 0 4px">' +
              t('newPR') +
              '</p><p style="font:700 17px var(--sora);letter-spacing:-.02em;margin:0">' +
              exName(ex) +
              ' — ' +
              ltr(fmtW(best.w) + ' kg × ' + best.r) +
              '</p><p style="font:500 12px var(--mono);color:var(--stone);margin:4px 0 0">' +
              t('e1rm', { x: ltr(e1rm(best.w, best.r).toFixed(1)) }) +
              '</p></div></div>'
          })
          var breakdown = ''
          SESSION.forEach(function (ex, i) {
            var logged = state.ex[i].logged
            if (!logged.length) return
            breakdown +=
              '<p style="font:700 12px var(--sora);letter-spacing:.06em;text-transform:uppercase;color:var(--stone);margin:6px 0 2px">' +
              exName(ex) +
              '</p>'
            var wn = 0
            logged.forEach(function (s) {
              if (!s.warm) wn++
              breakdown +=
                '<div style="display:flex;justify-content:space-between;align-items:center;font:500 13px var(--mono);min-height:22px"><span style="color:' +
                (s.warm ? 'var(--stone)' : 'var(--text)') +
                '">' +
                (s.warm ? t('warmTag') : t('setWord', { n: wn })) +
                (s.pr ? '<span class="pr-tag">PR</span>' : '') +
                '</span><span style="color:var(--stone);white-space:nowrap">' +
                ltr(fmtW(s.w) + ' × ' + s.r) +
                '</span></div>'
            })
          })
          return (
            '<div class="screen" data-screen="finish">' +
            STATUSBAR +
            '<div style="padding:26px 22px 18px;flex-shrink:0">' +
            '<p style="font:500 13px var(--hanken);color:var(--stone);margin:0 0 8px">' +
            t('finSub') +
            '</p>' +
            '<p style="font:800 34px/1.12 var(--sora);letter-spacing:-.03em;margin:0">' +
            t('finTitle') +
            '</p></div>' +
            '<div class="scroll-col" style="gap:12px">' +
            '<div style="display:flex;gap:10px;flex-shrink:0">' +
            '<div class="panel" style="flex:1;padding:14px 16px"><p dir="ltr" style="font:700 22px var(--sora);letter-spacing:-.02em;margin:0;font-variant-numeric:tabular-nums;text-align:start">' +
            fmt(state.elapsed) +
            '</p><p style="font:500 11.5px var(--hanken);color:var(--stone);margin:3px 0 0">' +
            t('duration') +
            '</p></div>' +
            '<div class="panel" style="flex:1;padding:14px 16px"><p dir="ltr" style="font:700 22px var(--sora);letter-spacing:-.02em;margin:0;font-variant-numeric:tabular-nums;text-align:start">' +
            volume.toLocaleString('en-US') +
            '</p><p style="font:500 11.5px var(--hanken);color:var(--stone);margin:3px 0 0">' +
            t('kgLifted') +
            '</p></div>' +
            '<div class="panel" style="flex:1;padding:14px 16px"><p dir="ltr" style="font:700 22px var(--sora);letter-spacing:-.02em;margin:0;font-variant-numeric:tabular-nums;text-align:start">' +
            allSets.length +
            '</p><p style="font:500 11.5px var(--hanken);color:var(--stone);margin:3px 0 0">' +
            t('setsTile') +
            '</p></div></div>' +
            prCards +
            '<div class="card" style="padding:16px 18px;display:flex;gap:12px;align-items:flex-start;flex-shrink:0">' +
            glyph(26, 'var(--text)', true) +
            '<p style="font:500 14px/1.6 var(--hanken);color:var(--body);margin:0">' +
            t('debrief') +
            '</p></div>' +
            '<div class="card" style="padding:14px 18px;display:flex;flex-direction:column;gap:4px;flex-shrink:0">' +
            breakdown +
            '</div></div>' +
            '<div style="padding:14px 22px 30px;display:flex;gap:10px;flex-shrink:0">' +
            '<button type="button" data-act="done" style="flex:1;display:flex;align-items:center;justify-content:center;font:700 15px var(--sora);color:var(--text);background:var(--surface);box-shadow:0 0 0 1px var(--line-strong);border-radius:99px;height:56px">' +
            t('share') +
            '</button>' +
            '<button type="button" data-act="done" style="flex:1;display:flex;align-items:center;justify-content:center;font:700 15px var(--sora);color:var(--flip-text);background:var(--flip-bg);border-radius:99px;height:56px">' +
            t('done') +
            '</button></div></div>'
          )
        }

        function render() {
          var html
          if (state.screen === 'home') html = renderHome()
          else if (state.screen === 'workout') html = renderWorkout()
          else if (state.screen === 'rest') html = renderRest()
          else html = renderFinish()
          root.innerHTML = html
        }

        /* ---------- actions ---------- */
        function startRest(afterWarm) {
          state.restTotal = afterWarm ? WARM_REST : WORK_REST
          state.restLeft = state.restTotal
          state.resting = true
        }

        var actions = {
          start: function () {
            state.screen = 'workout'
            prepInputs()
          },
          goHome: function () {
            state.screen = 'home'
          },
          finish: function () {
            state.screen = 'finish'
            state.resting = false
          },
          done: function () {
            state = initialState()
          },
          incW: function () {
            state.weight += cur().inc
          },
          decW: function () {
            state.weight = Math.max(0, state.weight - cur().inc)
          },
          incR: function () {
            state.reps += 1
          },
          decR: function () {
            state.reps = Math.max(1, state.reps - 1)
          },
          logSet: function () {
            var p = nextPlanned(state.exIndex)
            curEx().logged.push({
              w: state.weight,
              r: state.reps,
              warm: p.warm,
              pr: false,
            })
            recomputePRs(state, state.exIndex)
            startRest(p.warm)
            prepInputs()
          },
          nextExercise: function () {
            if (state.exIndex >= SESSION.length - 1) {
              state.screen = 'finish'
              state.resting = false
              return
            }
            state.exIndex += 1
            prepInputs()
          },
          addSet: function () {
            curEx().extra += 1
            prepInputs()
          },
          updateSet: function () {
            var s = curEx().logged[state.editing]
            if (s) {
              s.w = state.weight
              s.r = state.reps
              recomputePRs(state, state.exIndex)
            }
            prepInputs()
          },
          removeSet: function () {
            if (state.editing !== null) {
              curEx().logged.splice(state.editing, 1)
              recomputePRs(state, state.exIndex)
            }
            prepInputs()
          },
          cancelEdit: function () {
            prepInputs()
          },
          expandRest: function () {
            state.screen = 'rest'
          },
          collapseRest: function () {
            state.screen = 'workout'
          },
          skipRest: function () {
            state.resting = false
            state.restLeft = state.restTotal
            state.screen = 'workout'
          },
          add30: function () {
            state.restLeft = state.restLeft + 30
            state.restTotal = Math.max(state.restTotal, state.restLeft)
          },
          sub30: function () {
            state.restLeft = Math.max(1, state.restLeft - 30)
          },
        }

        root.addEventListener('click', function (e) {
          var sub = e.target.closest('[data-sub]')
          if (sub) {
            e.stopPropagation()
            actions[sub.getAttribute('data-sub')]()
            render()
            return
          }
          var jump = e.target.closest('[data-jump]')
          if (jump) {
            state.exIndex = parseInt(jump.getAttribute('data-jump'), 10)
            prepInputs()
            render()
            return
          }
          var editBtn = e.target.closest('[data-edit-set]')
          if (editBtn) {
            var gi = parseInt(editBtn.getAttribute('data-edit-set'), 10)
            var s = curEx().logged[gi]
            if (s) {
              state.editing = gi
              state.weight = s.w
              state.reps = s.r
            }
            render()
            return
          }
          var num = e.target.closest('[data-num]')
          if (num && !num.querySelector('input')) {
            var field = num.getAttribute('data-num')
            var input = document.createElement('input')
            input.className = 'step-input'
            input.type = 'text'
            input.inputMode = field === 'weight' ? 'decimal' : 'numeric'
            input.value = field === 'weight' ? fmtW(state.weight) : String(state.reps)
            input.setAttribute('dir', 'ltr')
            num.textContent = ''
            num.appendChild(input)
            input.focus()
            input.select()
            var commit = function () {
              var raw = input.value.replace(',', '.').replace(/[^0-9.]/g, '')
              var v = parseFloat(raw)
              if (!isNaN(v)) {
                if (field === 'weight') state.weight = Math.min(500, Math.max(0, v))
                else state.reps = Math.min(100, Math.max(1, Math.round(v)))
              }
              render()
            }
            input.addEventListener('blur', commit)
            input.addEventListener('keydown', function (ev) {
              if (ev.key === 'Enter') input.blur()
              if (ev.key === 'Escape') {
                input.removeEventListener('blur', commit)
                render()
              }
            })
            return
          }
          var btn = e.target.closest('[data-act]')
          if (!btn) return
          var act = actions[btn.getAttribute('data-act')]
          if (!act) return
          act()
          render()
        })

        /* ---------- prototype controls ---------- */
        document.getElementById('ctl-locale').addEventListener('click', function () {
          locale = locale === 'en' ? 'ar' : 'en'
          document.documentElement.lang = locale
          document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr'
          this.textContent = locale === 'en' ? 'عربي' : 'EN'
          render()
        })
        document.getElementById('ctl-theme').addEventListener('click', function () {
          theme = theme === 'light' ? 'dark' : 'light'
          if (theme === 'dark')
            document.documentElement.setAttribute('data-theme', 'dark')
          else document.documentElement.removeAttribute('data-theme')
          this.textContent = theme === 'light' ? 'Dark' : 'Light'
        })

        /* ---------- clock ---------- */
        setInterval(function () {
          var onWorkout = state.screen === 'workout'
          var onRest = state.screen === 'rest'
          if (!onWorkout && !onRest) return
          state.elapsed += 1
          var el = document.getElementById('elapsed')
          if (el) el.textContent = fmt(state.elapsed)
          if (state.resting) {
            if (state.restLeft <= 1) {
              state.resting = false
              state.restLeft = state.restTotal
              if (onRest) state.screen = 'workout'
              render()
              return
            }
            state.restLeft -= 1
            var lbl = document.getElementById('rest-label')
            if (lbl) lbl.textContent = fmt(state.restLeft)
            var tot = document.getElementById('rest-total')
            if (tot) tot.textContent = fmt(state.restTotal)
            var ring = document.getElementById('ring')
            if (ring)
              ring.setAttribute(
                'stroke-dashoffset',
                String(RING * (state.restLeft / state.restTotal)),
              )
            var chipT = document.getElementById('chip-time')
            if (chipT) chipT.textContent = fmt(state.restLeft)
            var chipR = document.getElementById('chip-ring')
            if (chipR)
              chipR.setAttribute(
                'stroke-dashoffset',
                String(CHIP_RING * (state.restLeft / state.restTotal)),
              )
          }
        }, 1000)

        state = initialState()
        render()
      })()
    </script>
  </body>
</html>
