name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Check vercel.json
        # Nothing else in this job reads vercel.json. On 2026-08-05 a comment
        # key in a rewrite made Vercel reject every deploy, main included, while
        # this workflow stayed green — production froze on the previous build
        # and looked healthy the whole time.
        run: npm run check:vercel

      - name: Check the coverage floor
        # Not a percentage — a list. Every module in src/lib either has a test
        # file or an exemption with a written reason, and a new module with
        # neither fails here. src/lib/social.ts had no test at all while a
        # percentage would have read as high the whole time, and that is the
        # module where follows and likes silently failed for every user.
        run: npm run check:coverage

      - name: Check the design tokens agree across both stacks
        # The palette now feeds TWO rendering stacks that cannot share a
        # stylesheet: the web app's Tailwind v4 `@theme` block in index.css,
        # and the Expo app's Tailwind 3.4 config, which NativeWind requires as
        # JavaScript. `src/lib/tokens.ts` is the source and this compares all
        # three.
        #
        # It found three real defects the hour it was written: the data chip
        # shipped at 14% against the handoff's 15%, `nano` shipped with no
        # letter-spacing at all against a specified 0.1em, and the brass chip
        # ground had no token in the app despite brass being drawn on four
        # surfaces. None of those were visible; all three were a diff away.
        run: npm run check:tokens

      - name: Check the type ramp
        # Every font size in src/ is a named step or a named idiom. The gate
        # the P0 plan proposed was `grep text-[Npx]`, which would have passed
        # with 203 Tailwind default size classes still in place — text-sm is
        # every bit as unnamed as text-[14px], it just looks tidier.
        run: npm run check:type

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check migrations parse
        # Nothing else in this job reads SQL. CLAUDE.md has told a human to run
        # this since 0007 shipped a column named `position` — a reserved word,
        # which is a parse error, so the whole migration was rejected before a
        # single statement ran. A rule someone has to remember is not a check.
        #
        # pglast wraps libpg_query, the parser Postgres itself uses, so this
        # needs no server and no connection. It is still only the floor: it
        # cannot see a wrong column name or a broken RLS predicate. `0016` and
        # `0017` are both parse-clean and neither has ever been executed.
        #
        # The step below is what raised that floor.
        run: |
          pip install pglast
          python3 scripts/check_migrations.py

      - name: Execute migrations and run the SQL suites
        # The floor above is a PARSER. This is a SERVER.
        #
        # Both of the defects 0021 shipped with were invisible to the parse
        # check and died on the first execution: a `default (select auth.uid())`
        # — legal grammar, rejected by every real Postgres, because a column
        # default may not contain a subquery — and an `order by` naming a column
        # the subquery had aliased away. STATUS has said for weeks that "a
        # migration that has never been executed is unverified"; this executes
        # every one of them, in order, from an empty database.
        #
        # Ubuntu runners ship Postgres, so this needs no service container and
        # no credentials. `scripts/check_sql.sh` starts a throwaway cluster on a
        # unix socket with `listen_addresses` empty, applies `scripts/pg_shim.sql`
        # for the parts of Supabase the migrations reference but do not own, and
        # then runs `supabase/tests/coach_surfaces.sql` — which asserts what the
        # coach's SQL actually RETURNS, not merely that it was accepted.
        #
        # It does NOT prove production will accept them: production is at 0018
        # with a ledger that knows about three migrations. "Applies cleanly from
        # empty" and "applies cleanly to production" are different claims.
        run: npm run check:sql

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck Edge Functions
        # `tsc` sees three of the eight files under supabase/functions, and only
        # because src/lib tests import the pure _shared modules across the
        # boundary. context.ts, openrouter.ts and all three index.ts — auth,
        # quota, the model key, the alias sign-in — were in no typecheck and no
        # test, while merging to main deploys them (deploy-functions.yml).
        #
        # Deno resolves the https:// imports itself, which is the whole reason
        # this needs a second toolchain rather than another tsconfig.
        run: deno check supabase/functions/**/*.ts

      - name: Test
        run: npm test

      - name: Build
        # Placeholder Supabase config on purpose: without it the app short
        # circuits on the "not configured" screen and the authenticated screens
        # are tree-shaken out of the bundle, so a build error in them would slip
        # through CI.
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build

  mobile:
    # The Expo app. A separate job with its own `npm ci`, because `mobile/` is
    # a separate package with its own lockfile. (Until 2026-08-20 the stated
    # reason was NativeWind v4 pinning Tailwind 3.4 against the web app's v4.
    # NativeWind is gone — the app used `className` zero times — so that
    # particular conflict no longer exists, but the packages stay separate:
    # adding a `workspaces` key to the root changes how Vercel installs.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
        working-directory: mobile

      - name: Typecheck
        run: npm run typecheck
        working-directory: mobile

      - name: Lint
        # The first version of this job ran tsc and expo export and no linter,
        # and an unused import reached main inside the hour. tsc does not flag
        # unused imports without `noUnusedLocals` and Metro happily bundles
        # dead code. The config also carries the RTL rule — React Native's
        # `marginLeft` does not flip in Arabic any more than Tailwind's `ml-`
        # does — and on its first run it caught three `setState`-in-effect
        # violations of the rule CLAUDE.md has warned about since U7.
        run: npx expo lint
        working-directory: mobile

      - name: Check every navigation target is a real route
        # `experiments.typedRoutes` is on and enforces NOTHING here: the dev
        # server writes `.expo/types`, `.expo/` is gitignored, and `expo
        # export` does not generate it — so on a fresh checkout the
        # `.expo/types/**` entry in tsconfig matches zero files and a typo'd
        # `router.push('/sesion/new')` typechecks clean. This checks the same
        # invariant straight off the filesystem, with nothing generated to go
        # stale.
        run: npm run check:routes
        working-directory: mobile

      # Runs BEFORE the two bundle builds on purpose: a broken reducer should
      # fail in seconds rather than behind four minutes of Metro. Stage 4A
      # phase A0 requires this step by name; mobile/ carried a passing suite
      # that nothing executed until 2026-08-19.
      - name: Test
        working-directory: mobile
        run: npm test

      - name: Bundle for iOS
        # THE gate for this app, and the reason it is worth a CI job.
        #
        # `expo export` runs the real Metro bundler through the real Babel
        # pipeline — NativeWind's `jsxImportSource`, the Reanimated plugin, the
        # React Compiler — and resolves every import including the shared
        # domain modules that live outside this package (metro.config.js
        # reaches into ../src/lib). Typecheck sees none of that: a broken
        # babel preset, a metro alias that does not resolve, a font subpath
        # that does not exist, and a NativeWind version that has fallen out
        # with React Native are all clean to tsc and fatal here.
        #
        # It is not a simulator and it does not prove pixels. It proves the
        # app builds, which is the claim CI is allowed to make.
        run: npm run bundle:ios
        working-directory: mobile

      - name: Bundle for Android
        # Both platforms, because the two bundles differ: platform-specific
        # module resolution (`.ios.tsx` / `.android.tsx`) means an import can
        # resolve on one and not the other, and Android is the platform this
        # app's users are more likely to be on.
        run: npm run bundle:android
        working-directory: mobile

  smoke:
    # A separate job so it runs alongside `check` rather than after it — the
    # browser download is the slow part and nothing in `check` depends on this.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke
        # The only thing in this repo that looks at the app, and since U3b the
        # only thing that can answer GATE 4 — `e2e/offline.spec.ts` runs a
        # whole workout with the project's network cut and asserts what the
        # server holds afterwards. It found the defect that made rung 1 a
        # no-op: the checkpoint was cleared on mount, before the load path
        # could read it, so "kill the tab, reopen, nothing lost" had never
        # actually worked.
        #
        # Three more defects reached production in one day through the gap
        # this job closes:
        # `inset-block-0` rendering four elements at height 0, follows and
        # likes never sending their owner column, and progress functions that
        # had never drawn. Lint sees syntax, typecheck sees types, unit tests
        # see functions — none of them can see a screen.
        #
        # Supabase is stubbed at the network layer, so this needs no project,
        # no key and no egress. playwright.config.ts builds and previews the
        # real production bundle, because both of those defects were
        # build-shaped.
        run: npm run test:smoke

  plan-state:
    # The one mechanical cause of this project's drift, and it has already
    # happened four times: PRs #103, #104, #105 and #106 each merged code to
    # main without touching WAZN_PLAN.md, whose section 7.0 the repo declares
    # its single source of truth. By 2026-08-19 that block was nine commits
    # stale and opened the next session by naming, as the "next action", work
    # that had already shipped. Nothing was broken. The RECORD was, which is
    # worse, because the record is the first thing every session reads.
    #
    # `.claude/hooks/status-guard.sh` (PR #107) closes the same loop locally.
    # Hooks are local: they fire only inside a Claude Code session, on a
    # machine that has them checked out and enabled. They cannot see a commit
    # pushed from a phone, a cloud session, another editor, or a human. This
    # is the universal half of that pair, and it deliberately mirrors the
    # hook's wording so the two read as one rule.
    #
    # Its own job rather than a step in `check`, for three reasons: `check`
    # also runs on pushes to main, where there is no PR to diff against; this
    # needs neither node nor a checkout, so it answers in seconds instead of
    # waiting behind a six-minute build wall; and a stale plan is a different
    # failure from a broken build and should be legible as one on the PR.
    #
    # ENFORCEMENT, honestly stated: this repo is PRIVATE on the GitHub free
    # plan, where branch protection and required status checks do not exist
    # (the protection endpoints answer 403). So this job fails loudly and red,
    # and a human can still merge straight past it. It becomes enforcing the
    # moment the repo goes public or onto a paid plan, with no change needed
    # here: tick it on as a required check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Code changed, so WAZN_PLAN.md must have changed too
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # File NAMES only, straight from the API, so no checkout and no
          # fetch-depth games. `gh pr diff` would pull the whole patch and
          # errors on very large diffs; the files endpoint paginates.
          changed=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')

          # The four trees whose contents a future session has to be told
          # about. `.md` files under them are excluded on purpose: a README in
          # mobile/ changes no state, and requirement was that a
          # documentation-only PR never trips this.
          code=$(printf '%s\n' "$changed" \
            | grep -E '^(src|mobile|supabase/migrations|supabase/functions)/' \
            | grep -v '\.md$' || true)

          if [ -z "$code" ]; then
            echo "No code paths changed in this PR. Nothing for section 7.0 to reconcile."
            exit 0
          fi

          if printf '%s\n' "$changed" | grep -qx 'WAZN_PLAN.md'; then
            echo "Code changed and WAZN_PLAN.md is in this PR. Good."
            exit 0
          fi

          echo "::error title=WAZN_PLAN.md was not updated::This PR changes code under src/, mobile/, supabase/migrations/ or supabase/functions/ and leaves the source of truth untouched. See the job log for the two ways to fix it."
          {
            echo ""
            echo "FAILED: this PR changes code and never touches WAZN_PLAN.md."
            echo ""
            echo "Code changed:"
            printf '%s\n' "$code" | head -20 | sed 's/^/  /'
            echo ""
            echo "WHY THIS FAILS:"
            echo "  WAZN_PLAN.md section 7.0 is the authoritative current-state block. It is what"
            echo "  the next session reads before it decides what to build, and section 6 requires"
            echo "  it to be updated with what is now true. PRs #103, #104, #105 and #106 all"
            echo "  skipped that. Section 7.0 went nine commits stale and told the following"
            echo "  session to build a feature that had already shipped. Merged code that nobody"
            echo "  wrote down is code the next session rebuilds or contradicts."
            echo ""
            echo "TWO ACCEPTABLE RESOLUTIONS. Pick one:"
            echo "  1. Update section 7.0 with what is now true and date-stamp it. This is the"
            echo "     usual answer for anything that ships behaviour, schema or a screen."
            echo "  2. If this change genuinely alters no state a future session needs (a rename,"
            echo "     a test-only edit, a comment), add ONE line to section 7.1 saying so, with"
            echo "     the date and the reason. Section 7.1 is the chronological log; section 7.0"
            echo "     is the claim. A change that alters no claim still belongs in the log."
            echo ""
            echo "If the change also embodies a decision, append the reasoning to DECISIONS.md."
          } >&2
          exit 1

  android:
    # ── THE ANDROID APP HAS NEVER BEEN COMPILED. THIS COMPILES IT. ────────────
    # `mobile/android/` is gitignored and had never been generated until
    # 2026-08-24; `npm run bundle:android` emits a JS bundle and stops, which is
    # the "`bundle:ios` is not a build" lesson one platform further out. Nothing
    # in this repo has ever run the Android toolchain, so nothing has ever seen
    # a config plugin's Android output, a manifest merge, or a Gradle failure.
    #
    # It runs HERE rather than on the laptop because a GitHub runner already has
    # the JDK and the Android SDK. The machine this repo is developed on has 11
    # GB free and four documented rounds of disk pressure, and the plan says not
    # to install Android Studio for exactly that reason. A runner costs no local
    # disk, no EAS credits and no interactive login.
    #
    # Its own job, not a step inside `mobile`, so a five-minute Gradle build
    # never delays typecheck, lint and the bundle.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci
        working-directory: mobile

      - name: Generate the native project
        # `--clean` so this is always the project the config plugins produce
        # today, never a stale checkout. SENTRY_DISABLE_AUTO_UPLOAD because
        # `@sentry/react-native` injects two build phases that shell out to
        # `sentry-cli`, which wants an org and a token that do not exist yet.
        # That is what broke the iOS build on 2026-08-23.
        run: npx expo prebuild --platform android --clean
        working-directory: mobile
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          EXPO_PUBLIC_SUPABASE_URL: https://example.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-not-a-real-key

      - name: Compile
        # `assembleRelease`, not `assembleDebug`: the release source set is what
        # a store upload is built from, and it is the one whose manifest merge
        # nobody had ever seen.
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'

      - name: The merged manifest must not ask to draw over other apps
        # ── THE ASSERTION THIS JOB EXISTS FOR ────────────────────────────────
        # React Native declares SYSTEM_ALERT_WINDOW in its debug source set for
        # the dev overlay, and prebuild writes it into `src/main`, which release
        # builds from. `android.blockedPermissions` in `app.config.ts` answers
        # that with `tools:node="remove"` — but that is an INSTRUCTION to the
        # manifest merger, and the merger only runs inside a Gradle build. Until
        # this job existed the removal was verified as written and unverified as
        # merged, which is the same gap as "executed locally is not applied".
        #
        # Reads the MERGED output, not the source manifest. Fails loudly if the
        # file moves rather than passing on a grep that found nothing, which is
        # this repo's most repeated bug.
        working-directory: mobile/android
        run: |
          merged=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged*release*' | head -1)
          if [ -z "$merged" ]; then
            echo "COULD NOT DETERMINE: no merged release manifest found." >&2
            find app/build/intermediates -name AndroidManifest.xml | sed 's/^/  /' >&2
            exit 1
          fi
          echo "merged manifest: $merged"
          grep -o 'android:name="android.permission.[A-Z_]*"' "$merged" | sort -u | sed 's/^/  /'
          if grep -q 'SYSTEM_ALERT_WINDOW' "$merged"; then
            echo "" >&2
            echo "SYSTEM_ALERT_WINDOW survived the merge and would ship to Play." >&2
            echo "See android.blockedPermissions in mobile/app.config.ts." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        # The first Android binary this project has ever produced. Sideloadable,
        # so it is also the fastest way for Ameen to see the app on a phone
        # without an EAS build or a developer account.
        with:
          name: wazn-android-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
