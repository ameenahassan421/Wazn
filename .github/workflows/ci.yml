name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Check vercel.json
        # Nothing else in this job reads vercel.json. On 2026-08-05 a comment
        # key in a rewrite made Vercel reject every deploy, main included, while
        # this workflow stayed green — production froze on the previous build
        # and looked healthy the whole time.
        run: npm run check:vercel

      - name: Check the coverage floor
        # Not a percentage — a list. Every module in src/lib either has a test
        # file or an exemption with a written reason, and a new module with
        # neither fails here. src/lib/social.ts had no test at all while a
        # percentage would have read as high the whole time, and that is the
        # module where follows and likes silently failed for every user.
        run: npm run check:coverage

      - name: Check the type ramp
        # Every font size in src/ is a named step or a named idiom. The gate
        # the P0 plan proposed was `grep text-[Npx]`, which would have passed
        # with 203 Tailwind default size classes still in place — text-sm is
        # every bit as unnamed as text-[14px], it just looks tidier.
        run: npm run check:type

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check migrations parse
        # Nothing else in this job reads SQL. CLAUDE.md has told a human to run
        # this since 0007 shipped a column named `position` — a reserved word,
        # which is a parse error, so the whole migration was rejected before a
        # single statement ran. A rule someone has to remember is not a check.
        #
        # pglast wraps libpg_query, the parser Postgres itself uses, so this
        # needs no server and no connection. It is still only the floor: it
        # cannot see a wrong column name or a broken RLS predicate. `0016` and
        # `0017` are both parse-clean and neither has ever been executed.
        #
        # The step below is what raised that floor.
        run: |
          pip install pglast
          python3 scripts/check_migrations.py

      - name: Execute migrations and run the SQL suites
        # The floor above is a PARSER. This is a SERVER.
        #
        # Both of the defects 0021 shipped with were invisible to the parse
        # check and died on the first execution: a `default (select auth.uid())`
        # — legal grammar, rejected by every real Postgres, because a column
        # default may not contain a subquery — and an `order by` naming a column
        # the subquery had aliased away. STATUS has said for weeks that "a
        # migration that has never been executed is unverified"; this executes
        # every one of them, in order, from an empty database.
        #
        # Ubuntu runners ship Postgres, so this needs no service container and
        # no credentials. `scripts/check_sql.sh` starts a throwaway cluster on a
        # unix socket with `listen_addresses` empty, applies `scripts/pg_shim.sql`
        # for the parts of Supabase the migrations reference but do not own, and
        # then runs `supabase/tests/coach_surfaces.sql` — which asserts what the
        # coach's SQL actually RETURNS, not merely that it was accepted.
        #
        # It does NOT prove production will accept them: production is at 0018
        # with a ledger that knows about three migrations. "Applies cleanly from
        # empty" and "applies cleanly to production" are different claims.
        run: npm run check:sql

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck Edge Functions
        # `tsc` sees three of the eight files under supabase/functions, and only
        # because src/lib tests import the pure _shared modules across the
        # boundary. context.ts, openrouter.ts and all three index.ts — auth,
        # quota, the model key, the alias sign-in — were in no typecheck and no
        # test, while merging to main deploys them (deploy-functions.yml).
        #
        # Deno resolves the https:// imports itself, which is the whole reason
        # this needs a second toolchain rather than another tsconfig.
        run: deno check supabase/functions/**/*.ts

      - name: Test
        run: npm test

      - name: Build
        # Placeholder Supabase config on purpose: without it the app short
        # circuits on the "not configured" screen and the authenticated screens
        # are tree-shaken out of the bundle, so a build error in them would slip
        # through CI.
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build

  smoke:
    # A separate job so it runs alongside `check` rather than after it — the
    # browser download is the slow part and nothing in `check` depends on this.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke
        # The only thing in this repo that looks at the app, and since U3b the
        # only thing that can answer GATE 4 — `e2e/offline.spec.ts` runs a
        # whole workout with the project's network cut and asserts what the
        # server holds afterwards. It found the defect that made rung 1 a
        # no-op: the checkpoint was cleared on mount, before the load path
        # could read it, so "kill the tab, reopen, nothing lost" had never
        # actually worked.
        #
        # Three more defects reached production in one day through the gap
        # this job closes:
        # `inset-block-0` rendering four elements at height 0, follows and
        # likes never sending their owner column, and progress functions that
        # had never drawn. Lint sees syntax, typecheck sees types, unit tests
        # see functions — none of them can see a screen.
        #
        # Supabase is stubbed at the network layer, so this needs no project,
        # no key and no egress. playwright.config.ts builds and previews the
        # real production bundle, because both of those defects were
        # build-shaped.
        run: npm run test:smoke
